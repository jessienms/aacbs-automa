<title>크고 작은 생물들 솔로 봇</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 게임판을 닮은 4열 행동 칸 격자가 중심, 위에 라운드/차례 바, 오른쪽(모바일은 아래)에 봇 상태와 기록 */
:root {
  --meadow: #3f6b34;      /* 게임판 초원 */
  --meadow-deep: #2c4d25;
  --straw: #f3dc8a;       /* 행동 칸 노란 바탕 */
  --straw-edge: #c9a94a;
  --bg: #eef0e4;          /* 녹색 기운의 밝은 중립 */
  --surface: #fbfbf5;
  --fg: #23261c;
  --muted: #61664f;
  --line: #d3d6c2;
  --player: #2c5d9c;      /* 플레이어 일꾼 */
  --bot: #a33b2b;         /* 봇 일꾼 */
  --tile-fg: #2e2a17;
  --ok: #2f7d3b;
  --font-display: "Do Hyeon", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --meadow: #4f8442; --meadow-deep: #1b2a17; --straw: #d9c272; --straw-edge: #9c8434;
  --bg: #151910; --surface: #1f251a; --fg: #e8ebdc; --muted: #a3a98f; --line: #343b2c;
  --player: #7fa9e6; --bot: #e58a76; --tile-fg: #241f0c; --ok: #7cc788; color-scheme: dark } }
:root[data-theme="dark"] {
  --meadow: #4f8442; --meadow-deep: #1b2a17; --straw: #d9c272; --straw-edge: #9c8434;
  --bg: #151910; --surface: #1f251a; --fg: #e8ebdc; --muted: #a3a98f; --line: #343b2c;
  --player: #7fa9e6; --bot: #e58a76; --tile-fg: #241f0c; --ok: #7cc788; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
.sub { color: var(--muted); margin: 4px 0 0; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, .space:focus-visible { outline: 3px solid var(--player); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--meadow); border-color: var(--meadow); color: #fff; font-weight: 700; }
button.primary:hover:not(:disabled) { background: var(--meadow-deep); }
input, select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Setup */
.setup { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.modes { display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.mode input { grid-row: span 2; margin-top: 4px; }
.mode b { font-weight: 700; }
.mode span { color: var(--muted); font-size: 13px; }
.mode:has(input:checked) { border-color: var(--meadow); background: color-mix(in srgb, var(--meadow) 9%, var(--surface)); }
.bld-row { display: grid; grid-template-columns: 2.4em minmax(0, 1fr) 3em; gap: 8px; align-items: center; }
.field { display: grid; gap: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.row .field { flex: 1 1 120px; }

/* Play */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--meadow-deep); color: #f4f1dc; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.status .round { font-family: var(--font-display); font-size: 26px; }
.pips { display: flex; gap: 4px; }
.pip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #f4f1dc88; }
.pip.done { background: #f4f1dc; }
.pip.now { background: var(--straw); border-color: var(--straw); }
.turn { margin-left: auto; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: #ffffff1c; }
.workers { display: flex; gap: 14px; font-size: 13px; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 3px; }
.dot.p { background: var(--player); } .dot.b { background: var(--bot); }

.play { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .play { grid-template-columns: minmax(0, 1fr); } }

.boardwrap { background: var(--meadow); border-radius: 14px; padding: 12px; overflow-x: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 8px; min-width: 520px; }
.space { position: relative; background: var(--straw); color: var(--tile-fg); border: 2px solid var(--straw-edge); border-radius: 10px; padding: 8px 9px 9px; min-height: 104px; display: grid; grid-template-rows: auto 1fr auto; gap: 4px; text-align: left; }
.space.click { cursor: pointer; }
.space.click:hover { box-shadow: 0 0 0 3px #fff8; }
.space.taken { filter: saturate(.55); }
.space.lastbot { box-shadow: 0 0 0 3px var(--bot); }
.space .no { font-family: var(--font-mono); font-size: 12px; background: var(--tile-fg); color: var(--straw); border-radius: 4px; padding: 0 5px; justify-self: start; }
.space .nm { font-weight: 700; font-size: 14px; line-height: 1.25; }
.space .ds { font-size: 11.5px; opacity: .78; line-height: 1.3; }
.goods { display: flex; flex-wrap: wrap; gap: 4px; min-height: 22px; align-content: end; }
.chip { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: #fff9; border: 1px solid #0002; white-space: nowrap; }
.chip.wood { background: #b07a45; color: #fff; } .chip.stone { background: #6f7176; color: #fff; }
.chip.reed { background: #e8e1c8; } .chip.fence { background: #e2c12f; }
.chip.sheep { background: #fff; } .chip.pig { background: #2b2b2b; color: #fff; }
.chip.cow { background: #8a5a35; color: #fff; } .chip.horse { background: #c6955e; color: #fff; }
.chip.ext { background: #5f8f4e; color: #fff; } .chip.stall { background: #d9d0b0; }
.occ { display: flex; gap: 4px; position: absolute; top: 7px; right: 7px; }
.meeple { width: 22px; height: 24px; border-radius: 11px 11px 4px 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; }
.meeple.p { background: var(--player); } .meeple.b { background: var(--bot); }
.space.wide .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.slot { border: 1.5px dashed #0004; border-radius: 6px; padding: 4px 6px; font-size: 11.5px; min-height: 30px; display: flex; align-items: center; gap: 6px; }
.slot.full { border-style: solid; background: #fff7; }
@media (max-width: 600px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); min-width: 0; } .boardwrap { padding: 8px; } }
.legend { color: #f4f1dcd0; font-size: 12px; margin: 8px 2px 0; }

.buildings { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
@media (max-width: 560px) { .buildings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bld { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.bld .nm { font-weight: 700; overflow-wrap: anywhere; }
.bld .own { font-size: 12px; color: var(--muted); }
.bld.bot { border-color: var(--bot); } .bld.bot .own { color: var(--bot); font-weight: 700; }
.bld.player { border-color: var(--player); } .bld.player .own { color: var(--player); font-weight: 700; }

.side { display: grid; gap: 14px; min-width: 0; }
.callout { border-radius: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.callout.botmove { border-left: 5px solid var(--bot); }
.die { font-family: var(--font-mono); font-size: 34px; line-height: 1; color: var(--bot); }
.botline { display: flex; align-items: center; gap: 14px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.stats .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stats .total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
.log { max-height: 260px; overflow: auto; font-size: 13px; display: grid; gap: 3px; padding-right: 4px; }
.log div { color: var(--muted); } .log div b { color: var(--fg); font-weight: 500; }
.supply { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.supply b { color: var(--fg); }

/* Modal */
.modal { position: fixed; inset: 0; background: #0008; display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--surface); color: var(--fg); border-radius: 14px; padding: 18px; width: min(440px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
.choice { display: grid; gap: 8px; }
.choice button { text-align: left; }

.rules { margin-top: 28px; }
.rules details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 10px; }
.rules ol, .rules ul { margin: 6px 0; padding-left: 20px; max-width: 65ch; }
.rules li { margin: 2px 0; }

.endgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.verdict { font-family: var(--font-display); font-size: 34px; }
@media (prefers-reduced-motion: no-preference) { .space.lastbot { animation: pulse 1s ease-out 1; } }
/* 하단 고정 바: 모바일에서 봇 결과와 주요 버튼을 엄지 영역에 모음 */
.dock { display: none; }
.lg { display: inline; } .sh { display: none; }
@media (max-width: 640px) {
  body { font-size: 14px; }
  .wrap { padding-block: 10px calc(104px + env(safe-area-inset-bottom, 0px)); }
  header.top { margin-bottom: 8px; align-items: center; flex-wrap: nowrap; }
  header.top h1 { font-size: 21px; }
  header.top .sub, .m-hide { display: none !important; }
  header.top button { padding: 6px 10px; font-size: 13px; }
  .status { padding: 8px 12px; margin-bottom: 8px; gap: 6px 12px; flex-wrap: nowrap; }
  .status .round { font-size: 20px; white-space: nowrap; }
  .status .pip { width: 9px; height: 9px; }
  .status .turn, .status .label { display: none; }
  .workers { margin-left: auto; white-space: nowrap; }
  .boardwrap { padding: 6px; border-radius: 12px; overflow: visible; }
  .board { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; min-width: 0; }
  .space { min-height: 70px; padding: 5px 5px 6px; gap: 3px; border-width: 1.5px; border-radius: 8px; grid-template-rows: auto 1fr; }
  .space .ds { display: none; }
  .lg { display: none; } .sh { display: inline; }
  .space .nm { font-size: 12.5px; display: block; margin-top: 2px; letter-spacing: -.02em; }
  .space .no { font-size: 10px; padding: 0 4px; }
  .occ { top: 4px; right: 4px; }
  .meeple { width: 17px; height: 19px; font-size: 9px; border-radius: 9px 9px 3px 3px; }
  .chip { font-size: 10.5px; padding: 0 5px; }
  .goods { gap: 2px; min-height: 0; }
  .space.wide .slots { grid-template-columns: 1fr; gap: 3px; }
  .slot { font-size: 10px; min-height: 20px; padding: 1px 3px; gap: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .slot .meeple { flex: none; }
  .legend { display: none; }
  .buildings { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 8px; }
  .bld { padding: 5px 6px; border-radius: 8px; }
  .bld .nm { font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bld .own { font-size: 10.5px; }
  .play { gap: 12px; }
  .side .botmove, .side .endcall { display: none; }
  .dock { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px #0002;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .dock-in { display: flex; align-items: center; gap: 12px; min-height: 56px; }
  .dock-msg { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .dock-msg .die { font-size: 30px; }
  .dock-msg .t { min-width: 0; font-size: 13px; line-height: 1.35; }
  .dock-msg .t b { font-size: 14px; }
  .dock-msg .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-btns { display: flex; gap: 8px; flex: none; }
  .dock-btns button { min-height: 48px; padding: 8px 14px; }
  .dock .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--player); color: #fff; }
  .dock .pill.bot { background: var(--bot); }
  .modal { place-items: end center; padding: 0; }
  .modal .box { width: 100%; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .choice button, #mclose { min-height: 48px; }
  .setup { gap: 12px; }
  .panel { padding: 14px; }
  .mode span { font-size: 12px; }
  #start { display: none; }
}
@keyframes pulse { from { box-shadow: 0 0 0 10px color-mix(in srgb, var(--bot) 30%, transparent); } }

/* 설정: 특수 건물 드롭다운 */
.bld-row select { width: 100%; }
.bld-row .vp { text-align: right; font-size: 13px; }
.bld-note { font-size: 12px; color: var(--muted); margin: -6px 0 0 2.9em; }
/* 봇 알림 */
.notice { border-top: 5px solid var(--bot); }
.takes { margin: 0; padding-left: 20px; font-weight: 700; }
/* 점수 계산 */
.endsum { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 32px; background: var(--meadow-deep); color: #f4f1dc; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
.endsum .label { color: #f4f1dcb0; }
.endsum .big { font-size: 38px; line-height: 1.1; }
.endsum .verdict { margin-left: auto; color: var(--straw); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 5.5em 3.2em; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.srow .sl { min-width: 0; display: grid; }
.srow .sl small { color: var(--muted); font-size: 12px; }
.srow select { width: 100%; min-height: 40px; }
.srow .sp { text-align: right; font-weight: 700; }
.srow.total { border-bottom: 0; border-top: 2px solid var(--fg); font-size: 18px; font-weight: 700; }
.panel h3 { margin-top: 6px; }
</style>

  ["말 사육장", 3], ["먹이용 근대밭", 0], ["멧돼지 우리", 0], ["목공소", 1], ["목수 공방", 1],
  ["목장", 2], ["목재 상점", 1], ["바닥재 전문점", 0], ["분만실", 0], ["사료 저장고", 0, [0, 3], "여물통 5개 이상이면 3점"],
  ["사무실", 6, [6, 4, 2, 0, -2], "윗줄 건물 1채당 -2점"], ["소 농장", 1], ["소 시장", 2],
  ["소 축사", 0, [0, 4], "소 11마리 이상이면 4점"], ["여관", 4], ["오리 연못", 1], ["온실", 1],
  ["우유 농장", 3], ["울타리 설치업소", 0], ["유기농 농장", 4], ["인테리어 용품점", 1], ["임시 사육장", 1],
  ["자재 할인점", 7], ["작업장", 2], ["작은 확장터", 0, [0, 2, 4, 6, 8], "인접 건물 1채당 2점"],
  ["저택", 7, [7, 5, 3, 1, -1], "아랫줄 건물 1채당 -2점"], ["전원주택", 1], ["제재소", 4],
  ["증축된 오두막", 4], ["집사의 사무실", -3], ["큰 확장터", 0, [0, 2, 4, 6, 8], "인접 건물 1채당 2점"],
  ["통나무 집", 0, [0, 4], "개인 창고 나무 4개 이상이면 4점"], ["품종 연구소", 0], ["하인의 집", 0], ["헛간", 0],
].map(([name, vp, opts, note]) => ({ name, vp, opts, note }));
// 기본 특수 건물 (항상 사용, 봇은 가져가지 않음)
const BASIC = [
  { name: "나무골조 집", vp: 5 }, { name: "개방형 외양간", vp: 2 },
  { name: "가축 보호소", vp: 0 }, { name: "저장고", vp: 0, note: "건축 자원 1개당 0.5점" },
];
// 가축 추가 점수 표 (룰북 8쪽): [1점 시작, 2점 시작, 3점 시작] 마리 수
const BONUS = { sheep: [8, 11, 13], pig: [7, 9, 11], cow: [6, 8, 10], horse: [5, 7, 9] };
const ANIMALS = [["sheep", "양"], ["pig", "돼지"], ["cow", "소"], ["horse", "말"]];
const STALL_VP = 1, STABLE_VP = 4;

const MODES = {
  easy:  { nm: "쉬움", ds: "플레이어가 항상 선. 봇은 점수 없음 (내 점수 갱신하기)" },
  normal:{ nm: "보통", ds: "라운드마다 선 플레이어 교대. 라운드 끝에 농장 확장 칸에 경계선 2개 이상이면 봇이 가져가고 확장판도 1개 가져감. 봇 점수 없음" },
  hard:  { nm: "어려움", ds: "플레이어가 항상 후. 경계선 1개 이상 남으면 봇이 가져감. 봇은 건물 점수 + 경계선·확장판당 2점" },
  farm:  { nm: "팜마겟돈", ds: "어려움 규칙 + 마지막 라운드 시작 때 봇이 경계선 1개와 확장판 1개를 가져감. 축사는 외양간 점수, 경계선·확장판당 3점" },
};

function add(goods, k, n) { goods[k] = (goods[k] || 0) + n; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function goodsText(g) { return Object.entries(g || {}).filter(([, n]) => n > 0).map(([k, n]) => `${G[k]} ${n}`).join(", "); }
function vpText(b) { return b.opts ? `${b.opts[0] < b.opts[b.opts.length - 1] ? b.opts[0] + "~" + b.opts[b.opts.length - 1] : b.opts[b.opts.length - 1] + "~" + b.opts[0]}점` : `${b.vp}점`; }
function randomPicks() { return shuffle(SPECIAL.map((_, i) => i)).slice(0, 4); }
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
function opt(v, cur, label) { return `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${label ?? v}</option>`; }

// ---------- 상태 ----------
const KEY = "acbs-automa-v2";
let S = null;          // 게임 상태
let history = [];      // 되돌리기 스냅샷
let modal = null;      // 화면 전용 선택 창
let botTimer = null;
let load0 = null;

function freshSetup(prev) {
  const st = prev?.settings;
  return {
    phase: "setup",
    settings: st && st.picks ? st : { mode: "normal", firstNormal: "player", picks: randomPicks(), extensions: 4, stalls: 4 },
  };
}

function save() { try { localStorage.setItem(KEY, JSON.stringify({ S, history: history.slice(-40) })); } catch (e) {} }
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.S) { S = d.S; history = d.history || []; return true; } } catch (e) {}
  return false;
}
function snapshot() { history.push(JSON.stringify(S)); if (history.length > 60) history.shift(); }
function log(html) { S.log.unshift({ r: S.round, t: html }); }

// ---------- 게임 흐름 ----------
function startGame() {
  const st = S.settings;
  S = {
    phase: "play", settings: st, round: 0,
    goods: {}, roundFences: 8,
    extLeft: +st.extensions, stallsLeft: +st.stalls,
    buildings: st.picks.map((k, i) => ({ no: 17 + i, key: k, name: SPECIAL[k].name, vp: SPECIAL[k].vp, owner: null })),
    basic: BASIC.map(b => ({ name: b.name, owner: null })),
    bot: { fences: 9, ext: 0, stalls: 0 },
    me: { ext: 0, stalls: 0 },
    placed: [], first: "player", lastBot: null, log: [], notice: null,
  };
  history = [];
  nextRound();
}

function firstFor(round) {
  const m = S.settings.mode;
  if (m === "easy") return "player";
  if (m === "hard" || m === "farm") return "bot";
  const f = S.settings.firstNormal;
  return round % 2 === 1 ? f : (f === "player" ? "bot" : "player");
}

function nextRound() {
  S.round += 1; S.placed = []; S.lastBot = null;
  S.first = firstFor(S.round);
  for (const sp of SPACES) {
    const g = S.goods[sp.id] = S.goods[sp.id] || {};
    if (sp.acc) sp.acc(g);
    if (sp.id === 8 && S.roundFences > 0) { S.roundFences -= 1; add(g, "fence", 1); }
    if (sp.animal) {
      const empty = !Object.values(g).some(n => n > 0);
      add(g, empty ? sp.animal[0] : sp.animal[1], 1);
    }
  }
  log(`<b>${S.round}라운드 시작</b> · 선: ${S.first === "player" ? "플레이어" : "봇"}`);
  if (S.settings.mode === "farm" && S.round === 8) {
    const g = S.goods[8];
    const lines = [];
    if ((g.fence || 0) > 0) { g.fence -= 1; S.bot.fences += 1; lines.push("농장 확장 칸의 경계선 1개"); }
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; lines.push("농장 확장판 1개"); }
    log(`팜마겟돈: 봇이 일꾼 없이 ${lines.join(", ") || "가져갈 것이 없음"}`);
    if (lines.length) S.notice = { title: "팜마겟돈 · 마지막 라운드", lead: "봇이 일꾼을 놓지 않고 가져갑니다.", lines, foot: "게임판에서 상자로 치운 뒤 확인을 누르세요.", next: false };
  }
}

function whoseTurn() {
  if (S.placed.length >= 6) return null;
  const second = S.first === "player" ? "bot" : "player";
  return S.placed.length % 2 === 0 ? S.first : second;
}
function occupied(id) { return S.placed.filter(p => p.space === id); }
function slotFree() { return occupied(14).length < 2; }

// 봇: 지금 놓을 수 있는 빈 칸 중 무작위 하나. 특수 건물 자리가 비어 있으면 남은 17–20번 건물 각각이 후보.
function botCandidates() {
  const c = [];
  for (const sp of SPACES) if (sp.id !== 14 && occupied(sp.id).length === 0) c.push(sp.id);
  if (slotFree()) {
    const avail = S.buildings.filter(b => !b.owner).map(b => b.no);
    if (avail.length) c.push(...avail); else c.push(14);
  }
  return c;
}

function botTurn() {
  const cand = botCandidates();
  const n = cand[Math.floor(Math.random() * cand.length)];
  const space = n >= 17 ? 14 : n;
  const g = S.goods[space] || {};
  const taken = goodsText(g);
  const gain = [];
  if (space === 8) {
    if (g.fence) { S.bot.fences += g.fence; gain.push(`경계선 ${g.fence}`); }
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; gain.push("확장판 1"); }
  } else if (space === 9 && S.stallsLeft > 0) {
    S.stallsLeft -= 1; S.bot.stalls += 1; gain.push("축사 1");
  }
  let bName = null;
  if (n >= 17) { const b = S.buildings[n - 17]; b.owner = "bot"; bName = b.name; gain.push(b.name); }
  S.goods[space] = {};
  S.placed.push({ space, who: "bot", n, bld: bName });
  S.lastBot = { n, space, pool: cand.length, cleared: space === 8 ? "" : taken, gain: gain.join(", ") };
  log(`봇 <b>${n}. ${n >= 17 ? bName : SP[space].nm}</b> <span class="num">(${cand.length}곳 중)</span>` +
      (taken && space !== 8 ? ` · 공동 창고로: ${taken}` : "") + (gain.length ? ` · 수집: ${gain.join(", ")}` : ""));
}

function playerPlace(id, opt) {
  snapshot();
  const g = S.goods[id] || {};
  const taken = goodsText(g);
  let extra = "";
  if (id === 8 && opt?.ext && S.extLeft > 0) { S.extLeft -= 1; S.me.ext += 1; extra = " · 확장판 1개 연결"; }
  if (id === 9 && opt?.stall && S.stallsLeft > 0) { S.stallsLeft -= 1; S.me.stalls += 1; extra = " · 축사 1개 지음"; }
  let bName = null;
  if (id === 14 && opt?.bld != null) { const b = S.buildings[opt.bld]; b.owner = "player"; bName = b.name; }
  if (id === 14 && opt?.basic != null) { const b = S.basic[opt.basic]; b.owner = "player"; bName = b.name; }
  if (bName) extra = ` · ${bName} 건설`;
  S.goods[id] = {};
  S.placed.push({ space: id, who: "player", bld: bName });
  log(`플레이어 <b>${id}. ${SP[id].nm}</b>${taken ? ` · 가져감: ${taken}` : ""}${extra}`);
  modal = null;
  save(); render(); scheduleBot();
}

function scheduleBot() {
  clearTimeout(botTimer);
  if (S.phase === "play" && !S.notice && whoseTurn() === "bot") {
    botTimer = setTimeout(() => { botTurn(); save(); render(); scheduleBot(); }, 650);
  }
}

function endRound() {
  snapshot();
  const m = S.settings.mode;
  const need = m === "normal" ? 2 : (m === "hard" || m === "farm") ? 1 : Infinity;
  const g = S.goods[8] || {};
  log(`${S.round}라운드 종료 · 일꾼 회수 후 각자 번식`);
  if ((g.fence || 0) >= need) {
    const n = g.fence; S.bot.fences += n; g.fence = 0;
    const lines = [`농장 확장 칸의 경계선 ${n}개`];
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; lines.push("농장 확장판 1개"); }
    else lines.push("남은 확장판이 없어 경계선만 가져갑니다");
    log(`라운드 종료: 봇이 ${lines.join(", ")} 가져감`);
    S.notice = { title: "봇이 경계선을 가져갑니다", lead: `${MODES[m].nm} 규칙: 라운드가 끝날 때 농장 확장 칸에 경계선이 ${need}개 이상 남았습니다.`,
      lines, foot: "게임판에서 상자로 치운 뒤 다음 라운드를 시작하세요.", next: true };
    save(); render(); return;
  }
  proceedRound();
}
function proceedRound() {
  if (S.round >= 8) { S.phase = "end"; S.ps = initScore(); }
  else nextRound();
  save(); render(); scheduleBot();
}
function confirmNotice() {
  const nx = S.notice?.next;
  S.notice = null;
  if (nx) proceedRound(); else { save(); render(); scheduleBot(); }
}

function undo() {
  if (!history.length) return;
  clearTimeout(botTimer);
  S = JSON.parse(history.pop());
  modal = null;
  save(); render(); scheduleBot();
}

// ---------- 점수 ----------
function botScore() {
  const m = S.settings.mode;
  if (m === "easy" || m === "normal") return null;
  const per = m === "farm" ? 3 : 2;
  const stallEach = m === "farm" ? STABLE_VP : STALL_VP;
  const bld = S.buildings.filter(b => b.owner === "bot").reduce((a, b) => a + b.vp, 0);
  const p = { bld, stalls: S.bot.stalls * stallEach, fences: S.bot.fences * per, ext: S.bot.ext * per, per, stallEach };
  p.total = p.bld + p.stalls + p.fences + p.ext;
  return p;
}
function animalBonus(type, n) {
  if (n <= 3) return -3;
  const [a, b, c] = BONUS[type];
  if (n < a) return 0; if (n < b) return 1; if (n < c) return 2;
  return 3 + (n - c);
}
function initScore() {
  return {
    sheep: 0, pig: 0, cow: 0, horse: 0, extFull: 0,
    stalls: S.me.stalls, stables: 0, res: 0,
    basic: S.basic.map(b => b.owner === "player" ? 1 : 0),
    bvp: Object.fromEntries(S.buildings.map((b, i) => [i, SPECIAL[b.key].opts ? SPECIAL[b.key].opts[0] : b.vp])),
    extra: 0,
  };
}
function playerScore() {
  const ps = S.ps;
  const r = { animals: 0, bonus: 0, ext: ps.extFull * 4, bld: 0, rows: {} };
  for (const [k] of ANIMALS) { r.animals += +ps[k]; r.rows[k] = animalBonus(k, +ps[k]); r.bonus += r.rows[k]; }
  r.bld += ps.stalls * STALL_VP + ps.stables * STABLE_VP;
  BASIC.forEach((b, i) => { if (ps.basic[i]) r.bld += b.name === "저장고" ? ps.res * 0.5 : b.vp; });
  S.buildings.forEach((b, i) => { if (b.owner === "player") r.bld += +ps.bvp[i]; });
  r.extra = +ps.extra;
  r.total = r.animals + r.bonus + r.ext + r.bld + r.extra;
  return r;
}

}

function buildingOptions(cur, others) {

}

    <b>${MODES[st.mode].nm}</b><div>${st.picks.map(k => esc(SPECIAL[k].name)).join(" · ")}</div></div></div>
    <div class="dock-btns"><button class="primary" data-act="start">게임 시작</button></div></div></div>`;

  const sync = () => {

function spaceHTML(sp, myTurn) {
  const occ = occupied(sp.id);
  const g = S.goods[sp.id] || {};
  const chips = Object.entries(g).filter(([, n]) => n > 0).map(([k, n]) => `<span class="chip ${k}">${G[k]} ${n}</span>`).join("");
  const can = myTurn && playerCan(sp.id);
  const last = S.lastBot && S.lastBot.space === sp.id && whoseTurn() !== "bot" ? " lastbot" : "";
  let body;
  if (sp.wide) {
    body = `<div class="slots">${[0, 1].map(i => {
      const p = occ[i];
      if (!p) return `<div class="slot">빈 자리</div>`;
      return `<div class="slot full"><span class="meeple ${p.who === "bot" ? "b" : "p"}">${p.who === "bot" ? "봇" : "나"}</span>${esc(p.bld || "건물 없음")}</div>`;
    }).join("")}</div>`;
  } else body = `<div class="goods">${chips}</div>`;
  const meeples = sp.wide ? "" : `<div class="occ">${occ.map(p => `<span class="meeple ${p.who === "bot" ? "b" : "p"}">${p.who === "bot" ? "봇" : "나"}</span>`).join("")}</div>`;
  const label = `${sp.id}. ${sp.nm}${chips ? " · " + goodsText(g) : ""}${occ.length ? " · 사용 중" : ""}`;
  return `<div class="space${sp.wide ? " wide" : ""}${can ? " click" : ""}${occ.length && !sp.wide ? " taken" : ""}${last}"
    ${can ? `role="button" tabindex="0" data-sp="${sp.id}"` : ""} aria-label="${esc(label)}">
    <div><span class="no">${sp.id}</span> <span class="nm"><span class="lg">${sp.nm}</span><span class="sh">${sp.sh}</span></span><div class="ds">${sp.ds}</div></div>
    ${meeples}${body}</div>`;
}

function playerCan(id) {
  if (id === 14) return slotFree();
  return occupied(id).length === 0;
}

function renderPlay() {
  const turn = whoseTurn();
  const myTurn = turn === "player" && !S.notice;
  const pLeft = 3 - S.placed.filter(p => p.who === "player").length;
  const bLeft = 3 - S.placed.filter(p => p.who === "bot").length;
  const pips = Array.from({ length: 8 }, (_, i) => `<span class="pip ${i + 1 < S.round ? "done" : i + 1 === S.round ? "now" : ""}"></span>`).join("");
  const turnTxt = turn === "player" ? "내 차례 · 칸을 고르세요" : turn === "bot" ? "봇이 고르는 중…" : "일하기 단계 끝";
  const sc = botScore();
  const lb = S.lastBot;

  app.innerHTML = header(`<button class="m-hide" data-act="undo" ${history.length ? "" : "disabled"}>되돌리기</button><button id="newgame">새 게임</button>`) + `
  <div class="status">
    <span class="round">${S.round}라운드</span><span class="pips" aria-label="8라운드 중 ${S.round}라운드">${pips}</span>
    <span class="workers"><span><span class="dot p"></span>나 ${pLeft}</span><span><span class="dot b"></span>봇 ${bLeft}</span></span>
    <span class="label" style="color:#f4f1dcb0">${MODES[S.settings.mode].nm}</span>
    <span class="turn">${turnTxt}</span>
  </div>
  <div class="play">
    <div>
      <div class="boardwrap"><div class="board">${SPACES.map(sp => spaceHTML(sp, myTurn)).join("")}</div>
        <p class="legend">노란 칸을 눌러 일꾼을 놓습니다. 칸에 쌓인 물건은 직접 가져가고, 봇이 고른 칸의 물건은 공동 창고로 돌려놓으세요.</p></div>
      <div class="buildings">${S.buildings.map(b => `<div class="bld ${b.owner || ""}">
        <span class="label num">${b.no}</span><span class="nm">${esc(b.name)}</span>
        <span class="own">${vpText(SPECIAL[b.key])} · ${b.owner === "bot" ? "봇이 수집" : b.owner === "player" ? "내가 건설" : "남아 있음"}</span></div>`).join("")}</div>
    </div>
    <aside class="side">
      ${turn === null ? `<div class="callout endcall"><h3>집에 돌아오기 · 번식</h3>
        <p class="sub" style="margin:0">일꾼 6개를 모두 놓았습니다. 내 농장의 가축을 번식시킨 뒤 라운드를 끝내세요.</p>
        <button class="primary" data-act="endround">${S.round >= 8 ? "게임 종료 · 점수 계산" : `${S.round}라운드 끝내기`}</button></div>` : ""}
      ${lb ? `<div class="callout botmove"><span class="label">봇의 마지막 행동</span>
        <div class="botline"><span class="die">${lb.n}</span><div><b>${lb.n >= 17 ? esc(S.buildings[lb.n - 17].name) + " (특수 건물 짓기)" : SP[lb.space].nm}</b>
        <div class="sub" style="font-size:13px;margin:0">빈 칸 ${lb.pool}곳 중 무작위</div></div></div>
        ${lb.cleared ? `<div>공동 창고로 되돌리기: <b>${lb.cleared}</b></div>` : ""}
        ${lb.gain ? `<div>봇이 수집: <b>${esc(lb.gain)}</b></div>` : ""}</div>` : ""}
      <div class="callout"><h3>봇 현황</h3>
        <div class="stats">
          <span>경계선 (시작 9개 포함)</span><span class="v">${S.bot.fences}</span>
          <span>확장판</span><span class="v">${S.bot.ext}</span>
          <span>축사</span><span class="v">${S.bot.stalls}</span>
          <span>특수 건물</span><span class="v">${S.buildings.filter(b => b.owner === "bot").length}</span>
          ${sc ? `<span class="total">현재 봇 점수</span><span class="v total">${sc.total}</span>` : `<span class="total">봇 점수</span><span class="v total">없음</span>`}
        </div>
        <div class="supply"><span>남은 확장판 <b class="num">${S.extLeft}</b></span><span>남은 축사 <b class="num">${S.stallsLeft}</b></span><span>라운드 경계선 <b class="num">${S.roundFences}</b></span></div>
      </div>
      <div class="callout"><h3>기록</h3><div class="log">${S.log.map(l => `<div><span class="num">R${l.r}</span> ${l.t}</div>`).join("")}</div></div>
    </aside>
  </div>` + rulesHTML() + dockHTML(turn, lb) + modalHTML();

  app.querySelectorAll("[data-sp]").forEach(el => {
    const go = () => onSpace(+el.dataset.sp);
    el.onclick = go;
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
  app.querySelectorAll('[data-act="undo"]').forEach(b => b.onclick = undo);
  app.querySelectorAll('[data-act="endround"]').forEach(b => b.onclick = endRound);
  document.getElementById("newgame").onclick = () => { modal = { type: "confirmNew" }; render(); };
  bindModal();
}

function dockHTML(turn, lb) {
  let msg;
  const pill = turn === "player" ? `<span class="pill">내 차례</span>` : turn === "bot" ? `<span class="pill bot">봇 차례</span>` : "";
  if (turn === null) msg = `<div class="t"><b>번식 단계</b><div>가축을 번식시킨 뒤 진행</div></div>`;
  else if (turn === "bot") msg = `<span class="die">…</span><div class="t">${pill}<div>봇이 칸을 고르는 중</div></div>`;
  else if (lb) msg = `<span class="die">${lb.n}</span><div class="t">${pill}
      <div><b>${lb.n >= 17 ? esc(S.buildings[lb.n - 17].name) : SP[lb.space].nm}</b></div>
      <div>${lb.cleared ? `창고로: ${lb.cleared}` : lb.gain ? `봇 수집: ${esc(lb.gain)}` : `빈 칸 ${lb.pool}곳 중 무작위`}</div></div>`;
  else msg = `<div class="t">${pill}<div>게임판 칸을 눌러 일꾼을 놓으세요</div></div>`;
  const end = turn === null ? `<button class="primary" data-act="endround">${S.round >= 8 ? "점수 계산" : `${S.round}R 끝내기`}</button>` : "";
  return `<div class="dock"><div class="dock-in"><div class="dock-msg">${msg}</div>
    <div class="dock-btns"><button data-act="undo" ${history.length ? "" : "disabled"}>되돌리기</button>${end}</div></div></div>`;
}

function onSpace(id) {
  if (id === 14) { modal = { type: "bld" }; render(); return; }
  if (id === 8) { modal = { type: "ext" }; render(); return; }
  if (id === 9) { modal = { type: "stall" }; render(); return; }
  playerPlace(id);
}

function modalHTML() {
  if (S.notice) {
    const n = S.notice;
    const btn = n.next ? (S.round >= 8 ? "확인 · 점수 계산" : `확인 · ${S.round + 1}라운드 시작`) : "확인";
    return `<div class="modal" id="modal"><div class="box notice" role="alertdialog" aria-modal="true" aria-labelledby="ntitle">
      <span class="label" style="color:var(--bot)">봇 알림</span><h3 id="ntitle">${n.title}</h3>
      <p class="sub" style="margin:0">${n.lead}</p>
      <ul class="takes">${n.lines.map(l => `<li>${l}</li>`).join("")}</ul>
      <p style="margin:0">${n.foot}</p>
      <button class="primary" id="nok">${btn}</button>
      <button id="nundo" ${history.length ? "" : "disabled"}>되돌리기</button></div></div>`;
  }
  if (!modal) return "";
  let inner = "";
  if (modal.type === "bld") {
    const sp = S.buildings.map((b, i) => b.owner ? "" : `<button data-bld="${i}">${b.no}. ${esc(b.name)} <span class="sub">(${vpText(SPECIAL[b.key])})</span></button>`).join("");
    const bs = S.basic.map((b, i) => b.owner ? "" : `<button data-basic="${i}">${esc(b.name)} <span class="sub">(기본 건물)</span></button>`).join("");
    inner = `<h3>어떤 건물을 짓나요?</h3><div class="choice">${sp}${bs}<button data-basic="-1">목록에 없음 · 자리만 사용</button></div>`;
  } else if (modal.type === "ext") {
    const g = S.goods[8] || {};
    inner = `<h3>농장 확장</h3><p class="sub" style="margin:0">경계선 ${g.fence || 0}개를 가져갑니다. 남은 확장판: ${S.extLeft}개</p>
      <div class="choice">${S.extLeft > 0 ? `<button data-opt="ext">경계선 + 확장판 1개 연결</button>` : ""}<button data-opt="none">경계선만 가져가기</button></div>`;
  } else if (modal.type === "stall") {
    inner = `<h3>축사 짓기</h3><p class="sub" style="margin:0">남은 축사 타일: ${S.stallsLeft}개</p>
      <div class="choice">${S.stallsLeft > 0 ? `<button data-opt="stall">축사 1개 짓기</button>` : ""}<button data-opt="none">타일 없이 칸만 사용</button></div>`;
  } else if (modal.type === "confirmNew") {
    inner = `<h3>새 게임을 시작할까요?</h3><p class="sub" style="margin:0">진행 중인 게임은 지워집니다.</p>
      <div class="choice"><button class="primary" data-opt="new">새 게임 설정으로</button></div>`;
  }
  return `<div class="modal" id="modal"><div class="box" role="dialog" aria-modal="true">${inner}<button id="mclose">취소</button></div></div>`;
}
function bindModal() {
  const m = document.getElementById("modal"); if (!m) return;
  const ok = document.getElementById("nok");
  if (ok) {
    ok.onclick = confirmNotice;
    document.getElementById("nundo").onclick = undo;
    ok.focus();
    return;
  }
  document.getElementById("mclose").onclick = () => { modal = null; render(); };
  m.onclick = e => { if (e.target === m) { modal = null; render(); } };
  m.querySelectorAll("[data-bld]").forEach(b => b.onclick = () => playerPlace(14, { bld: +b.dataset.bld }));
  m.querySelectorAll("[data-basic]").forEach(b => b.onclick = () => playerPlace(14, +b.dataset.basic >= 0 ? { basic: +b.dataset.basic } : {}));
  m.querySelectorAll("[data-opt]").forEach(b => b.onclick = () => {
    const o = b.dataset.opt;
    if (o === "new") { clearTimeout(botTimer); S = freshSetup(S); history = []; modal = null; save(); render(); return; }
    if (modal.type === "ext") playerPlace(8, { ext: o === "ext" });
    else if (modal.type === "stall") playerPlace(9, { stall: o === "stall" });
  });
  const first = m.querySelector(".choice button"); if (first) first.focus();
}

function scoreRow(id, label, options, cur, pts, hint) {
  return `<label class="srow" for="${id}"><span class="sl">${label}${hint ? `<small>${hint}</small>` : ""}</span>
    <select id="${id}">${options.map(o => Array.isArray(o) ? opt(o[0], cur, o[1]) : opt(o, cur)).join("")}</select>
    <span class="sp num">${fmt(pts)}</span></label>`;
}
function fmt(n) { return (n > 0 ? "+" : "") + (Number.isInteger(n) ? n : n.toFixed(1)); }

function renderEnd() {
  const sc = botScore();
  const ps = S.ps;
  const r = playerScore();
  let verdict = sc ? (r.total > sc.total ? "승리!" : r.total === sc.total ? "동점" : "봇의 승리") : "";
  let best = null; try { best = +localStorage.getItem(KEY + "-best-" + S.settings.mode) || null; } catch (e) {}
  const yesNo = [[0, "없음"], [1, "지음"]];
  const mine = S.buildings.map((b, i) => ({ b, i })).filter(x => x.b.owner === "player");

  app.innerHTML = header(`<button id="undo" ${history.length ? "" : "disabled"}>되돌리기</button><button class="primary" id="newgame">새 게임</button>`) + `
  <div class="endsum">
    <div><span class="label">내 점수</span><div class="big num">${fmt(r.total).replace("+", "")}</div></div>
    ${sc ? `<div><span class="label">봇 점수</span><div class="big num">${sc.total}</div></div><div class="verdict">${verdict}</div>`
         : `<div><span class="label">이 난이도 최고 점수</span><div class="big num">${best ?? "-"}</div></div>`}
  </div>
  <div class="endgrid">
    <section class="panel"><h2>내 점수 계산</h2>
      <p class="sub" style="margin:0;font-size:13px">농장을 보고 고르면 점수가 바로 계산됩니다.</p>
      <h3>가축</h3>
      ${ANIMALS.map(([k, nm]) => scoreRow("ps-" + k, `${nm}`, range(0, 40), ps[k], +ps[k] + r.rows[k], `기본 ${ps[k]} · 추가 ${fmt(r.rows[k])}`)).join("")}
      <h3>농장 확장</h3>
      ${scoreRow("ps-extFull", "농장 칸 3칸을 모두 쓴 확장판", range(0, 6), ps.extFull, r.ext, `가져온 확장판 ${S.me.ext}개 · 1개당 4점`)}
      <h3>건물</h3>
      ${scoreRow("ps-stalls", "축사", range(0, 6), ps.stalls, ps.stalls * STALL_VP, "1개당 1점")}
      ${scoreRow("ps-stables", "외양간", range(0, 6), ps.stables, ps.stables * STABLE_VP, "1개당 4점")}
      ${BASIC.map((b, i) => scoreRow("ps-basic-" + i, b.name, yesNo, ps.basic[i], ps.basic[i] ? (b.name === "저장고" ? ps.res * 0.5 : b.vp) : 0, b.note || `${b.vp}점`)).join("")}
      ${ps.basic[3] ? scoreRow("ps-res", "저장고 · 남은 건축 자원", range(0, 60), ps.res, ps.res * 0.5, "나무+돌+갈대 합계") : ""}
      ${mine.length ? mine.map(({ b, i }) => {
        const d = SPECIAL[b.key];
        return d.opts ? scoreRow("ps-bvp-" + i, b.name, d.opts.map(v => [v, `${v}점`]), ps.bvp[i], +ps.bvp[i], d.note)
                      : `<div class="srow"><span class="sl">${esc(b.name)}<small>특수 건물</small></span><span></span><span class="sp num">${fmt(b.vp)}</span></div>`;
      }).join("") : `<p class="sub" style="margin:0;font-size:13px">이번 게임에 지은 특수 건물(17–20번)이 없습니다.</p>`}
      ${scoreRow("ps-extra", "기타 조정", range(-10, 20), ps.extra, r.extra, "위에서 다루지 않은 점수")}
      <div class="srow total"><span class="sl">합계</span><span></span><span class="sp num">${fmt(r.total).replace("+", "")}</span></div>
    </section>
    <div class="side">
      <section class="panel"><h2>봇 최종 점수 · ${MODES[S.settings.mode].nm}</h2>
        ${sc ? `<div class="stats">
          <span>특수 건물 (${S.buildings.filter(b => b.owner === "bot").map(b => esc(b.name)).join(", ") || "없음"})</span><span class="v">${sc.bld}</span>
          <span>축사 ${S.bot.stalls}개 × ${sc.stallEach}</span><span class="v">${sc.stalls}</span>
          <span>경계선 ${S.bot.fences}개 × ${sc.per}</span><span class="v">${sc.fences}</span>
          <span>확장판 ${S.bot.ext}개 × ${sc.per}</span><span class="v">${sc.ext}</span>
          <span class="total">합계</span><span class="v total">${sc.total}</span></div>`
        : `<p class="sub">이 난이도에서 봇은 점수를 얻지 않습니다. 내 최고 점수를 넘어 보세요.</p>
           <div class="stats"><span>봇이 가져간 경계선</span><span class="v">${S.bot.fences}</span><span>봇이 가져간 확장판</span><span class="v">${S.bot.ext}</span></div>`}
      </section>
      <section class="panel"><h3>게임 기록</h3><div class="log">${S.log.map(l => `<div><span class="num">R${l.r}</span> ${l.t}</div>`).join("")}</div></section>
    </div>
  </div>` + modalHTML();

  app.querySelectorAll("select[id^=ps-]").forEach(el => el.onchange = () => {
    const k = el.id.slice(3);
    if (k.startsWith("basic-")) ps.basic[+k.slice(6)] = +el.value;
    else if (k.startsWith("bvp-")) ps.bvp[+k.slice(4)] = +el.value;
    else ps[k] = +el.value;
    const t = playerScore().total;
    try { const kk = KEY + "-best-" + S.settings.mode; if (t > (+localStorage.getItem(kk) || -99)) localStorage.setItem(kk, t); } catch (e) {}
    save(); renderEnd();
    const again = document.getElementById(el.id); if (again) again.focus();
  });
  document.getElementById("undo").onclick = undo;
  document.getElementById("newgame").onclick = () => { S = freshSetup(S); history = []; save(); render(); };
  bindModal();
}

function rulesHTML() {
  return `<section class="rules"><details><summary>솔로 변형 규칙 요약과 칸 번호</summary><div class="cols">
    <div><h3>칸 번호 (왼쪽 위 → 오른쪽, 다음 줄)</h3><ol>${SPACES.map(s => `<li>${s.nm}</li>`).join("")}
      <li value="17">17–20: 준비한 특수 건물 4개 (봇은 특수 건물 짓기 칸에 일꾼을 놓고 해당 건물을 수집)</li></ol></div>
    <div><h3>봇 규칙</h3><ul>
      <li>봇은 농장판이 없고 건물·울타리를 짓지 않습니다. 칸을 막고, 그 칸에 쌓인 자원·가축을 공동 창고로 돌려놓습니다.</li>
      <li>봇은 지금 비어 있는 칸 중 하나를 무작위로 고릅니다. 특수 건물 짓기 자리가 비어 있으면 남은 17–20번 건물 하나하나가 후보입니다.</li>
      <li>농장 확장 칸에서는 경계선과 확장판 1개를 수집합니다 (게임에서 제거).</li>
      <li>축사 짓기 칸에서는 축사 타일 1개를 수집합니다.</li>
      <li>각자 일꾼 3개, 차례를 번갈아 놓고 8라운드를 진행합니다.</li>
      <li>봇 점수에서 변동 점수 건물은 봇에게 농장이 없다고 보고 계산합니다 (저택 7점, 사무실 6점, 조건부 건물 0점).</li></ul></div>
  </div></details></section>`;
}

function render() {
  if (S.phase === "setup") renderSetup();
  else if (S.phase === "play") renderPlay();
  else renderEnd();
}

// ---------- 시작 ----------
function start(hot) {
  if (hot && hot.S && hot.S.settings?.picks) { S = hot.S; history = hot.history || []; }
  else if (load()) {
    if (S.phase !== "setup") { load0 = { S, history }; S = freshSetup(S); history = []; }
  } else S = freshSetup(null);
  render(); scheduleBot();
}
window.claude?.hot?.snapshot?.(() => ({ S, history }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
