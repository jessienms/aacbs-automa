<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>크고 작은 생물들 솔로 봇</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 룰북의 실제 게임판 이미지 위에 자원·일꾼을 겹쳐 보여주고, 아래에 건물 타일 띠, 오른쪽(모바일은 하단 바)에 봇 결과 */
:root {
  --meadow: #3f6b34;
  --meadow-deep: #2c4d25;
  --straw: #f3dc8a;
  --bg: #eef0e4;
  --surface: #fbfbf5;
  --fg: #23261c;
  --muted: #61664f;
  --line: #d3d6c2;
  --player: #2c5d9c;
  --bot: #b8402e;
  --font-display: "Do Hyeon", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --meadow: #4f8442; --meadow-deep: #1b2a17; --straw: #d9c272;
  --bg: #151910; --surface: #1f251a; --fg: #e8ebdc; --muted: #a3a98f; --line: #343b2c;
  --player: #7fa9e6; --bot: #ef8a74; color-scheme: dark } }
:root[data-theme="dark"] {
  --meadow: #4f8442; --meadow-deep: #1b2a17; --straw: #d9c272;
  --bg: #151910; --surface: #1f251a; --fg: #e8ebdc; --muted: #a3a98f; --line: #343b2c;
  --player: #7fa9e6; --bot: #ef8a74; color-scheme: dark }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; display: block; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
.sub { color: var(--muted); margin: 4px 0 0; }
.small { font-size: 13px; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:focus-visible, select:focus-visible, .spot:focus-visible, .tile:focus-visible { outline: 3px solid var(--player); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--meadow); border-color: var(--meadow); color: #fff; font-weight: 700; }
button.primary:hover:not(:disabled) { background: var(--meadow-deep); }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 설정 */
.setup { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.modes { display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.mode input { grid-row: span 2; margin-top: 4px; }
.mode b { font-weight: 700; }
.mode span { color: var(--muted); font-size: 13px; }
.mode:has(input:checked) { border-color: var(--meadow); background: color-mix(in srgb, var(--meadow) 9%, var(--surface)); }
.field { display: grid; gap: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.row .field { flex: 1 1 120px; }
.basicrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.basicrow img { border-radius: 6px; }
.pick { display: grid; grid-template-columns: 2.2em 44px minmax(0, 1fr); gap: 8px; align-items: center; }
.pick img { width: 44px; height: 44px; border-radius: 4px; }
.pick select { width: 100%; }
.pick-note { font-size: 12px; color: var(--muted); margin: -6px 0 0 calc(2.2em + 60px); }

/* 상태 바 */
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--meadow-deep); color: #f4f1dc; border-radius: 12px; padding: 10px 16px; margin-bottom: 14px; }
.status .round { font-family: var(--font-display); font-size: 26px; }
.pips { display: flex; gap: 4px; }
.pip { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #f4f1dc88; }
.pip.done { background: #f4f1dc; }
.pip.now { background: var(--straw); border-color: var(--straw); }
.turn { margin-left: auto; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: #ffffff1c; }
.workers { display: flex; gap: 14px; font-size: 13px; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 3px; }
.dot.p { background: var(--player); } .dot.b { background: var(--bot); }

.play { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .play { grid-template-columns: minmax(0, 1fr); } }

/* 실제 게임판 */
.board { position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: 100%; border-radius: 10px; overflow: hidden;
  background: #4a7a33 url("img/board.jpg") center / 100% 100% no-repeat; box-shadow: 0 2px 10px #0003; }
.spot { position: absolute; padding: 0; border: 0; background: transparent; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3%; }
.spot.half { border-radius: 999px 0 0 999px; } .spot.half.r { border-radius: 0 999px 999px 0; }
.spot.click { cursor: pointer; box-shadow: inset 0 0 0 2.5px #2c5d9cd9; }
.spot.click:hover { background: #2c5d9c26; }
.spot.taken::before { content: ""; position: absolute; inset: 0; background: #1b2414a8; border-radius: inherit; }
.spot.lastbot { box-shadow: 0 0 0 3px var(--bot), inset 0 0 0 2px var(--bot); }
@media (prefers-reduced-motion: no-preference) { .spot.lastbot { animation: pulse 1.2s ease-out 1; } }
@keyframes pulse { from { box-shadow: 0 0 0 14px #b8402e44, inset 0 0 0 2px var(--bot); } }
.tks { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; }
.tk { min-width: 1.9em; height: 1.9em; padding: 0 .35em; border-radius: 999px; display: inline-grid; place-items: center;
  font: 700 clamp(11px, 2.6vw, 15px)/1 var(--font-mono); border: 2px solid #fff; box-shadow: 0 1px 3px #0007; }
.tk.wood { background: #8b5a2b; color: #fff; } .tk.stone { background: #55585e; color: #fff; }
.tk.reed { background: #efe6c3; color: #3b3518; } .tk.fence { background: #e7c22c; color: #3b3518; }
.tk.sheep { background: #fff; color: #222; border-color: #222; } .tk.pig { background: #1e1e1e; color: #fff; }
.tk.cow { background: #7a4a24; color: #fff; } .tk.horse { background: #c9935a; color: #2a1a08; }
.meeple { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: clamp(22px, 6vw, 32px); aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; font: 700 clamp(10px, 2.6vw, 13px)/1 var(--font-body); color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px #0008; }
.meeple.p { background: var(--player); } .meeple.b { background: var(--bot); }

/* 건물 타일 띠 */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; margin-top: 10px; }
.tile { position: relative; padding: 0; border: 0; background: none; border-radius: 6px; overflow: hidden; }
.tile img { width: 100%; aspect-ratio: 1; }
.tile .no { position: absolute; left: 2px; bottom: 2px; font: 700 10px/1 var(--font-mono); background: #000a; color: #fff; padding: 2px 3px; border-radius: 3px; }
.tile.click { cursor: pointer; box-shadow: 0 0 0 2px var(--player); }
.tile.own-bot img, .tile.own-player img { filter: grayscale(.7) brightness(.55); }
.tile .own { position: absolute; inset: auto 0 38% 0; text-align: center; font-weight: 700; font-size: 12px; color: #fff; }
.tile .own span { padding: 2px 7px; border-radius: 99px; }
.tile.own-bot .own span { background: var(--bot); } .tile.own-player .own span { background: var(--player); }
.tile.lastbot { box-shadow: 0 0 0 3px var(--bot); }

.side { display: grid; gap: 14px; min-width: 0; }
.callout { border-radius: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.callout.botmove { border-left: 5px solid var(--bot); }
.big { font-family: var(--font-mono); font-size: 34px; line-height: 1; color: var(--bot); }
.botline { display: flex; align-items: center; gap: 14px; }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.stats .v { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stats .total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; }
.log { max-height: 260px; overflow: auto; font-size: 13px; display: grid; gap: 3px; padding-right: 4px; }
.log div { color: var(--muted); } .log div b { color: var(--fg); font-weight: 500; }
.supply { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.supply b { color: var(--fg); }

/* 확인 창 */
.modal { position: fixed; inset: 0; background: #0009; display: grid; place-items: center; padding: 16px; z-index: 20; overscroll-behavior: contain; }
html:has(.modal), html:has(.modal) body { overflow: hidden; }
.modal .box { overscroll-behavior: contain; background: var(--surface); color: var(--fg); border-radius: 14px; padding: 18px; width: min(460px, 100%); display: grid; gap: 12px; max-height: 88vh; overflow: auto; }
.box.notice { border-top: 5px solid var(--bot); }
.gain { display: flex; flex-wrap: wrap; gap: 8px; }
.gain .g { display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; border-radius: 99px; background: color-mix(in srgb, var(--meadow) 10%, var(--surface)); font-weight: 700; }
.gain .tk { font-size: 14px; }
.choice { display: grid; gap: 8px; }
.choice button { text-align: left; min-height: 46px; }
.choice .bopt { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; }
.choice .bopt img { width: 48px; height: 48px; border-radius: 4px; }
.takes { margin: 0; padding-left: 20px; font-weight: 700; }
.mhead { display: flex; gap: 12px; align-items: center; }
.mhead img { width: 72px; height: 72px; border-radius: 6px; flex: none; }

/* 점수 */
.endsum { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 32px; background: var(--meadow-deep); color: #f4f1dc; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; }
.endsum .label { color: #f4f1dcb0; }
.endsum .n { font: 700 38px/1.1 var(--font-mono); }
.endsum .verdict { margin-left: auto; color: var(--straw); font-family: var(--font-display); font-size: 34px; }
.endgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em 3.2em; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.srow .sl { min-width: 0; display: grid; }
.srow .sl small { color: var(--muted); font-size: 12px; }
.srow select { width: 100%; min-height: 40px; }
.srow .sp { text-align: right; font-weight: 700; }
.srow.total { border-bottom: 0; border-top: 2px solid var(--fg); font-size: 18px; font-weight: 700; }
.panel h3 { margin-top: 6px; }

.rules { margin-top: 28px; }
.rules details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.rules summary { cursor: pointer; font-weight: 700; }
.rules .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 10px; }
.rules ol, .rules ul { margin: 6px 0; padding-left: 20px; max-width: 65ch; }
.rules li { margin: 2px 0; }

/* 하단 고정 바 (모바일) */
.dock { display: none; }
@media (max-width: 640px) {
  body { font-size: 14px; }
  .wrap { padding-block: 10px calc(104px + env(safe-area-inset-bottom, 0px)); }
  header.top { margin-bottom: 8px; align-items: center; flex-wrap: nowrap; }
  header.top h1 { font-size: 21px; }
  header.top .sub, .m-hide { display: none !important; }
  header.top button { padding: 6px 10px; font-size: 13px; }
  .status { padding: 8px 12px; margin-bottom: 8px; gap: 6px 12px; flex-wrap: nowrap; }
  .status .round { font-size: 20px; white-space: nowrap; }
  .status .pip { width: 9px; height: 9px; }
  .status .turn, .status .label { display: none; }
  .workers { margin-left: auto; white-space: nowrap; }
  .tiles { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
  .tile .own { font-size: 10px; }
  .play { gap: 12px; }
  .side .botmove, .side .endcall { display: none; }
  .dock { display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px #0002;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .dock-in { display: flex; align-items: center; gap: 12px; min-height: 56px; }
  .dock-msg { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .dock-msg .big { font-size: 28px; }
  .dock-msg .t { min-width: 0; font-size: 13px; line-height: 1.35; }
  .dock-msg .t b { font-size: 14px; }
  .dock-msg .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-btns { display: flex; gap: 8px; flex: none; }
  .dock-btns button { min-height: 48px; padding: 8px 14px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--player); color: #fff; }
  .pill.bot { background: var(--bot); }
  .modal { place-items: end center; padding: 0; }
  .modal .box { width: 100%; border-radius: 16px 16px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .setup { gap: 12px; }
  .panel { padding: 14px; }
  .mode span { font-size: 12px; }
  #start { display: none; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
"use strict";

// ---------- 정적 데이터 ----------
const G = { wood: "나무", stone: "돌", reed: "갈대", fence: "경계선", sheep: "양", pig: "돼지", cow: "소", horse: "말" };
// 게임판 행동 칸과 이미지 위 위치(%: 왼쪽, 위, 오른쪽, 아래). 14번은 특수 건물 짓기 2자리.
const SPACES = [
  { id: 1, nm: "시작 플레이어 + 나무", ds: "시작 플레이어 마커를 가져옵니다 (솔로에서는 의미 없음)", box: [14.3, 4.2, 24.0, 20.5], half: "l", acc: s => add(s, "wood", 1) },
  { id: 2, nm: "나무 3개", box: [26.2, 4.2, 35.6, 20.5], half: "r", acc: s => add(s, "wood", 3) },
  { id: 3, nm: "돌 1개", box: [61.6, 4.2, 71.0, 20.5], half: "l", acc: s => add(s, "stone", 1) },
  { id: 4, nm: "돌 2개", box: [73.3, 4.2, 82.6, 20.5], half: "r", acc: s => add(s, "stone", 2) },
  { id: 5, nm: "울타리 치기", ds: "나무 1개당 경계선 1개를 원하는 만큼 놓습니다", box: [7.4, 27.5, 23.8, 44.7] },
  { id: 6, nm: "담장 쌓기", ds: "경계선 2개 무료, 그 뒤 돌 2개당 1개", box: [26.2, 27.5, 42.6, 44.7] },
  { id: 7, nm: "자원 시장", ds: "공동 창고에서 가져옵니다", box: [54.1, 27.5, 70.9, 44.7], fixed: { wood: 1, stone: 1, reed: 1 } },
  { id: 8, nm: "농장 확장", ds: "경계선을 모두 가져오고 확장판을 연결합니다", box: [73.3, 27.5, 89.4, 44.7] },
  { id: 9, nm: "축사 짓기", ds: "돌 3 + 갈대 1로 축사 1개", box: [7.4, 50.9, 23.8, 70.9] },
  { id: 10, nm: "여물통 놓기", ds: "1개 무료, 추가 1개당 나무 3", box: [26.2, 50.9, 42.6, 70.9] },
  { id: 11, nm: "갈대와 양", box: [56.5, 58.6, 70.9, 74.0], animal: ["reed", "sheep"] },
  { id: 12, nm: "돼지와 양", box: [73.3, 58.6, 87.2, 74.0], animal: ["pig", "sheep"] },
  { id: 13, nm: "외양간으로 개조", ds: "축사 1개당 나무 5 또는 돌 5", box: [7.4, 76.7, 23.8, 97.1] },
  { id: 14, nm: "특수 건물 짓기", ds: "건물 1개를 짓습니다", boxes: [[26.2, 76.7, 43.0, 82.4], [26.6, 91.0, 43.0, 97.1]] },
  { id: 15, nm: "소와 돼지", box: [56.5, 75.0, 70.9, 89.4], animal: ["cow", "pig"] },
  { id: 16, nm: "말과 양", box: [72.9, 75.0, 87.2, 89.4], animal: ["horse", "sheep"] },
];
const SP = Object.fromEntries(SPACES.map(s => [s.id, s]));

// 룰북 9–12쪽 건물. 배열 순서 = img/tiles/NN.jpg 번호. basic: 기본 특수 건물(항상 포함).
// vp = 봇 기준 점수, opts = 플레이어 점수 선택지(변동 점수일 때)
const BLD = [
  { name: "나무골조 집", vp: 5, basic: true }, { name: "저장고", vp: 0, basic: true, note: "건축 자원 1개당 0.5점" },
  { name: "가축 상점", vp: 3 }, { name: "마을회관", vp: 2 }, { name: "헛간", vp: 0 }, { name: "품종 연구소", vp: 0 },
  { name: "가축 보호소", vp: 0, basic: true }, { name: "개방형 외양간", vp: 2, basic: true },
  { name: "건설 회사", vp: 2 }, { name: "마구간 딸린 집", vp: 3 }, { name: "목수 공방", vp: 1 }, { name: "소 농장", vp: 1 },
  { name: "소 시장", vp: 2 }, { name: "온실", vp: 1 }, { name: "구석진 집", vp: 4 }, { name: "증축된 오두막", vp: 4 },
  { name: "전원주택", vp: 1 }, { name: "소 축사", vp: 0, opts: [0, 4], note: "소 11마리 이상이면 4점" },
  { name: "우유 농장", vp: 3 }, { name: "개집", vp: 0 }, { name: "오리 연못", vp: 1 },
  { name: "대농장", vp: 0, opts: [0, 3], note: "특수 건물 5채 이상이면 3점" }, { name: "농장용품점", vp: 0 },
  { name: "농업용 우물", vp: 0 }, { name: "사료 저장고", vp: 0, opts: [0, 3], note: "여물통 5개 이상이면 3점" },

  { name: "저택", vp: 7, opts: [7, 5, 3, 1, -1], note: "아랫줄 건물 1채당 -2점" }, { name: "자재 할인점", vp: 7 },
  { name: "사무실", vp: 6, opts: [6, 4, 2, 0, -2], note: "윗줄 건물 1채당 -2점" }, { name: "유기농 농장", vp: 4 },
  { name: "간이 우리", vp: 0 }, { name: "돼지 축사", vp: 0, opts: [0, 4], note: "돼지 13마리 이상이면 4점" },
  { name: "목장", vp: 2 }, { name: "임시 사육장", vp: 1 }, { name: "갈대집", vp: 0 }, { name: "제재소", vp: 4 },
  { name: "하인의 집", vp: 0 }, { name: "작은 확장터", vp: 0, opts: [0, 2, 4, 6, 8], note: "인접 건물 1채당 2점" },
  { name: "집사의 사무실", vp: -3 }, { name: "돌 조각소", vp: 0, opts: [0, 2, 4, 6, 8, 10, 12, 14], note: "올려둔 돌 1개당 2점" },
  { name: "말 사육장", vp: 3 }, { name: "목재 상점", vp: 1 }, { name: "거래소", vp: 1 }, { name: "멧돼지 우리", vp: 0 },
  { name: "목공소", vp: 1 }, { name: "작업장", vp: 2 },
];
const BASIC_KEYS = BLD.map((b, i) => b.basic ? i : -1).filter(i => i >= 0);
const EXTRA_KEYS = BLD.map((b, i) => b.basic ? -1 : i).filter(i => i >= 0).sort((a, b) => BLD[a].name.localeCompare(BLD[b].name, "ko"));
const STORE_KEY = BLD.findIndex(b => b.name === "저장고");
const BONUS = { sheep: [8, 11, 13], pig: [7, 9, 11], cow: [6, 8, 10], horse: [5, 7, 9] };
const ANIMALS = [["sheep", "양"], ["pig", "돼지"], ["cow", "소"], ["horse", "말"]];
const STALL_VP = 1, STABLE_VP = 4, MAX_EXTRA = 8;

const MODES = {
  easy:  { nm: "쉬움", ds: "플레이어가 항상 선. 봇은 점수 없음 (내 점수 갱신하기)" },
  normal:{ nm: "보통", ds: "라운드마다 선 플레이어 교대. 라운드 끝에 농장 확장 칸에 경계선 2개 이상이면 봇이 가져가고 확장판도 1개 가져감. 봇 점수 없음" },
  hard:  { nm: "어려움", ds: "플레이어가 항상 후. 경계선 1개 이상 남으면 봇이 가져감. 봇은 건물 점수 + 경계선·확장판당 2점" },
  farm:  { nm: "팜마겟돈", ds: "어려움 규칙 + 마지막 라운드 시작 때 봇이 경계선 1개와 확장판 1개를 가져감. 축사는 외양간 점수, 경계선·확장판당 3점" },
};

function add(goods, k, n) { goods[k] = (goods[k] || 0) + n; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function goodsText(g) { return Object.entries(g || {}).filter(([, n]) => n > 0).map(([k, n]) => `${G[k]} ${n}`).join(", "); }
function vpText(b) { if (!b.opts) return `${b.vp}점`; const lo = Math.min(...b.opts), hi = Math.max(...b.opts); return `${lo}~${hi}점`; }
function img(k) { return `img/tiles/${String(k).padStart(2, "0")}.jpg`; }
function randomExtras(n, keep) { const pool = shuffle(EXTRA_KEYS.filter(k => !keep.includes(k))); return keep.concat(pool).slice(0, n); }
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
function opt(v, cur, label) { return `<option value="${v}" ${String(v) === String(cur) ? "selected" : ""}>${label ?? v}</option>`; }
function pct(b) { return `left:${b[0]}%;top:${b[1]}%;width:${b[2] - b[0]}%;height:${b[3] - b[1]}%`; }
function tokens(g) { return Object.entries(g || {}).filter(([, n]) => n > 0).map(([k, n]) => `<span class="tk ${k}" title="${G[k]} ${n}">${n}</span>`).join(""); }

// ---------- 상태 ----------
const KEY = "acbs-automa-v3";
let S = null, history = [], modal = null, botTimer = null, load0 = null;

function freshSetup(prev) {
  const st = prev?.settings;
  return { phase: "setup", settings: st && st.extras ? st : { mode: "normal", firstNormal: "player", extras: randomExtras(4, []), extensions: 4, stalls: 4 } };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ S, history: history.slice(-40) })); } catch (e) {} }
function load() { try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && d.S) { S = d.S; history = d.history || []; return true; } } catch (e) {} return false; }
function snapshot() { history.push(JSON.stringify(S)); if (history.length > 60) history.shift(); }
function log(html) { S.log.unshift({ r: S.round, t: html }); }

// ---------- 게임 흐름 ----------
function startGame() {
  const st = S.settings;
  const keys = BASIC_KEYS.concat(st.extras);
  S = {
    phase: "play", settings: st, round: 0, goods: {}, roundFences: 8,
    extLeft: +st.extensions, stallsLeft: +st.stalls,
    buildings: keys.map((k, i) => ({ no: 17 + i, key: k, owner: null })),
    bot: { fences: 9, ext: 0, stalls: 0 }, me: { ext: 0, stalls: 0 },
    placed: [], first: "player", lastBot: null, log: [], notice: null,
  };
  history = [];
  nextRound();
}
function bname(b) { return BLD[b.key].name; }

function firstFor(round) {
  const m = S.settings.mode;
  if (m === "easy") return "player";
  if (m === "hard" || m === "farm") return "bot";
  const f = S.settings.firstNormal;
  return round % 2 === 1 ? f : (f === "player" ? "bot" : "player");
}

function nextRound() {
  S.round += 1; S.placed = []; S.lastBot = null;
  S.first = firstFor(S.round);
  for (const sp of SPACES) {
    const g = S.goods[sp.id] = S.goods[sp.id] || {};
    if (sp.acc) sp.acc(g);
    if (sp.id === 8 && S.roundFences > 0) { S.roundFences -= 1; add(g, "fence", 1); }
    if (sp.animal) add(g, Object.values(g).some(n => n > 0) ? sp.animal[1] : sp.animal[0], 1);
  }
  log(`<b>${S.round}라운드 시작</b> · 선: ${S.first === "player" ? "플레이어" : "봇"}`);
  if (S.settings.mode === "farm" && S.round === 8) {
    const g = S.goods[8], lines = [];
    if ((g.fence || 0) > 0) { g.fence -= 1; S.bot.fences += 1; lines.push("농장 확장 칸의 경계선 1개"); }
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; lines.push("농장 확장판 1개"); }
    log(`팜마겟돈: 봇이 일꾼 없이 ${lines.join(", ") || "가져갈 것이 없음"}`);
    if (lines.length) S.notice = { title: "팜마겟돈 · 마지막 라운드", lead: "봇이 일꾼을 놓지 않고 가져갑니다.", lines, foot: "게임판에서 상자로 치운 뒤 확인을 누르세요.", next: false };
  }
}

function whoseTurn() {
  if (S.placed.length >= 6) return null;
  return S.placed.length % 2 === 0 ? S.first : (S.first === "player" ? "bot" : "player");
}
function occupied(id) { return S.placed.filter(p => p.space === id); }
function slotFree() { return occupied(14).length < 2; }
function availBuildings() { return S.buildings.filter(b => !b.owner); }

// 봇: 지금 놓을 수 있는 모든 선택지 중 균등 무작위. 특수 건물 자리가 비어 있으면 남은 건물 하나하나가 선택지.
function botCandidates() {
  const c = SPACES.filter(sp => sp.id !== 14 && occupied(sp.id).length === 0).map(sp => sp.id);
  if (slotFree()) { const a = availBuildings().map(b => b.no); c.push(...(a.length ? a : [14])); }
  return c;
}

function botTurn() {
  const cand = botCandidates();
  const n = cand[Math.floor(Math.random() * cand.length)];
  const space = n >= 17 ? 14 : n;
  const g = S.goods[space] || {};
  const taken = goodsText(g), gain = [];
  if (space === 8) {
    if (g.fence) { S.bot.fences += g.fence; gain.push(`경계선 ${g.fence}`); }
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; gain.push("확장판 1"); }
  } else if (space === 9 && S.stallsLeft > 0) { S.stallsLeft -= 1; S.bot.stalls += 1; gain.push("축사 1"); }
  let bk = null;
  if (n >= 17) { const b = S.buildings[n - 17]; b.owner = "bot"; bk = b.key; gain.push(bname(b)); }
  S.goods[space] = {};
  S.placed.push({ space, who: "bot", bk });
  S.lastBot = { n, space, bk, pool: cand.length, cleared: space === 8 ? "" : taken, gain: gain.join(", ") };
  log(`봇 <b>${n >= 17 ? BLD[bk].name + " (건물)" : SP[space].nm}</b> <span class="num">(${cand.length}곳 중)</span>` +
      (taken && space !== 8 ? ` · 공동 창고로: ${taken}` : "") + (gain.length ? ` · 수집: ${gain.join(", ")}` : ""));
}

function playerPlace(id, o) {
  snapshot();
  const g = S.goods[id] || {};
  const taken = goodsText(id === 7 ? SP[7].fixed : g);
  let extra = "", bk = null;
  if (id === 8 && o?.ext && S.extLeft > 0) { S.extLeft -= 1; S.me.ext += 1; extra = " · 확장판 연결"; }
  if (id === 9 && o?.stall && S.stallsLeft > 0) { S.stallsLeft -= 1; S.me.stalls += 1; extra = " · 축사 1개"; }
  if (id === 14 && o?.bi != null) { const b = S.buildings[o.bi]; b.owner = "player"; bk = b.key; extra = ` · ${bname(b)} 건설`; }
  S.goods[id] = {};
  S.placed.push({ space: id, who: "player", bk });
  log(`플레이어 <b>${SP[id].nm}</b>${taken ? ` · 가져감: ${taken}` : ""}${extra}`);
  modal = null;
  save(); render(); scheduleBot();
}

function scheduleBot() {
  clearTimeout(botTimer);
  if (S.phase === "play" && !S.notice && whoseTurn() === "bot") botTimer = setTimeout(() => { botTurn(); save(); render(); scheduleBot(); }, 650);
}

function endRound() {
  snapshot();
  const m = S.settings.mode;
  const need = m === "normal" ? 2 : (m === "hard" || m === "farm") ? 1 : Infinity;
  const g = S.goods[8] || {};
  log(`${S.round}라운드 종료 · 일꾼 회수 후 각자 번식`);
  if ((g.fence || 0) >= need) {
    const n = g.fence; S.bot.fences += n; g.fence = 0;
    const lines = [`농장 확장 칸의 경계선 ${n}개`];
    if (S.extLeft > 0) { S.extLeft -= 1; S.bot.ext += 1; lines.push("농장 확장판 1개"); } else lines.push("남은 확장판이 없어 경계선만 가져갑니다");
    log(`라운드 종료: 봇이 ${lines.join(", ")} 가져감`);
    S.notice = { title: "봇이 경계선을 가져갑니다", lead: `${MODES[m].nm} 규칙: 라운드가 끝날 때 농장 확장 칸에 경계선이 ${need}개 이상 남았습니다.`, lines, foot: "게임판에서 상자로 치운 뒤 다음 라운드를 시작하세요.", next: true };
    save(); render(); return;
  }
  proceedRound();
}
function proceedRound() {
  if (S.round >= 8) { S.phase = "end"; S.ps = initScore(); } else nextRound();
  save(); render(); scheduleBot();
}
function confirmNotice() { const nx = S.notice?.next; S.notice = null; if (nx) proceedRound(); else { save(); render(); scheduleBot(); } }
function undo() { if (!history.length) return; clearTimeout(botTimer); S = JSON.parse(history.pop()); modal = null; save(); render(); scheduleBot(); }

// ---------- 점수 ----------
function botScore() {
  const m = S.settings.mode;
  if (m === "easy" || m === "normal") return null;
  const per = m === "farm" ? 3 : 2, stallEach = m === "farm" ? STABLE_VP : STALL_VP;
  const mine = S.buildings.filter(b => b.owner === "bot");
  const p = { names: mine.map(bname), bld: mine.reduce((a, b) => a + BLD[b.key].vp, 0), stalls: S.bot.stalls * stallEach, fences: S.bot.fences * per, ext: S.bot.ext * per, per, stallEach };
  p.total = p.bld + p.stalls + p.fences + p.ext;
  return p;
}
function animalBonus(type, n) {
  if (n <= 3) return -3;
  const [a, b, c] = BONUS[type];
  return n < a ? 0 : n < b ? 1 : n < c ? 2 : 3 + (n - c);
}
function initScore() {
  // bv: 건물별 점수 (null = 짓지 않음)
  const bv = {};
  S.buildings.forEach((b, i) => { if (b.owner === "player") bv[i] = BLD[b.key].opts ? BLD[b.key].opts[0] : BLD[b.key].vp; });
  return { sheep: 0, pig: 0, cow: 0, horse: 0, extFull: 0, stalls: S.me.stalls, stables: 0, res: 0, bv, extra: 0 };
}
function playerScore() {
  const ps = S.ps, r = { animals: 0, bonus: 0, ext: ps.extFull * 4, bld: 0, rows: {} };
  for (const [k] of ANIMALS) { r.animals += +ps[k]; r.rows[k] = animalBonus(k, +ps[k]); r.bonus += r.rows[k]; }
  r.bld = ps.stalls * STALL_VP + ps.stables * STABLE_VP;
  S.buildings.forEach((b, i) => { if (ps.bv[i] != null) r.bld += b.key === STORE_KEY ? ps.res * 0.5 : +ps.bv[i]; });
  r.extra = +ps.extra;
  r.total = r.animals + r.bonus + r.ext + r.bld + r.extra;
  return r;
}

// ---------- 렌더 ----------
const app = document.getElementById("app");
function header(extra) {

    <p class="sub">아그리콜라: 크고 작은 생물들 빅박스 · 1인 플레이용 오토마 (Sam Carpenter 솔로 변형 v1.1)</p></div>
    <div class="top-actions">${extra || ""}</div></header>`;
}

      <label class="field"><span class="label">추가 특수 건물 수</span>

      }).join("")}

      <button class="primary" id="start">게임 시작</button>
      <p class="sub small" style="margin:0">준비: 봇 몫으로 경계선 9개를 상자에 넣고, 남은 경계선 8개는 라운드 표시용으로 둡니다.</p>
    </section>
  </div>` + rulesHTML() + `<div class="dock"><div class="dock-in"><div class="dock-msg"><div class="t">
    <b>${MODES[st.mode].nm} · 건물 ${4 + n}개</b><div>${st.extras.map(k => esc(BLD[k].name)).join(" · ") || "기본 건물만"}</div></div></div>
    <div class="dock-btns"><button class="primary" data-act="start">게임 시작</button></div></div></div>`;

function boardHTML(myTurn) {
  const lb = S.lastBot && whoseTurn() !== "bot" ? S.lastBot : null;
  let h = "";
  for (const sp of SPACES) {
    if (sp.boxes) {
      const occ = occupied(14);
      sp.boxes.forEach((b, i) => {
        const p = occ[i];
        const can = myTurn && !p && i === occ.length && availBuildings().length;
        const last = lb && lb.space === 14 && i === occ.length - 1 && p?.who === "bot";
        h += `<div class="spot${p ? " taken" : ""}${can ? " click" : ""}${last ? " lastbot" : ""}" style="${pct(b)}"
          ${can ? `role="button" tabindex="0" data-sp="14" aria-label="특수 건물 짓기"` : `aria-label="특수 건물 짓기 ${i + 1}번째 자리${p ? " · 사용 중" : ""}"`}>
          ${p ? `<span class="meeple ${p.who === "bot" ? "b" : "p"}">${p.who === "bot" ? "봇" : "나"}</span>` : ""}</div>`;
      });
      continue;
    }
    const p = occupied(sp.id)[0];
    const g = S.goods[sp.id];
    const can = myTurn && !p;
    const label = `${sp.nm}${goodsText(g) ? " · " + goodsText(g) : ""}${p ? " · 사용 중" : ""}`;
    h += `<div class="spot${sp.half ? " half" + (sp.half === "r" ? " r" : "") : ""}${p ? " taken" : ""}${can ? " click" : ""}${lb && lb.space === sp.id ? " lastbot" : ""}" style="${pct(sp.box)}"
      ${can ? `role="button" tabindex="0" data-sp="${sp.id}"` : ""} aria-label="${esc(label)}">
      ${p ? "" : `<span class="tks">${tokens(g)}</span>`}
      ${p ? `<span class="meeple ${p.who === "bot" ? "b" : "p"}">${p.who === "bot" ? "봇" : "나"}</span>` : ""}</div>`;
  }
  return `<div class="board" role="group" aria-label="게임판">${h}</div>`;
}

function tilesHTML(myTurn) {
  const canBuild = myTurn && slotFree();
  const lb = S.lastBot && whoseTurn() !== "bot" ? S.lastBot : null;
  return `<div class="tiles">${S.buildings.map((b, i) => {
    const can = canBuild && !b.owner;
    return `<div class="tile${b.owner ? " own-" + b.owner : ""}${can ? " click" : ""}${lb && lb.bk === b.key ? " lastbot" : ""}"
      ${can ? `role="button" tabindex="0" data-bi="${i}"` : ""} title="${esc(bname(b))} · ${vpText(BLD[b.key])}">
      <img src="${img(b.key)}" alt="${esc(bname(b))}" loading="lazy"><span class="no">${b.no}</span>
      ${b.owner ? `<span class="own"><span>${b.owner === "bot" ? "봇" : "나"}</span></span>` : ""}</div>`;
  }).join("")}</div>`;
}

function lastBotName(lb) { return lb.bk != null ? `${BLD[lb.bk].name} (특수 건물)` : SP[lb.space].nm; }

function renderPlay() {
  const turn = whoseTurn();
  const myTurn = turn === "player" && !S.notice;
  const pLeft = 3 - S.placed.filter(p => p.who === "player").length;
  const bLeft = 3 - S.placed.filter(p => p.who === "bot").length;
  const pips = range(1, 8).map(i => `<span class="pip ${i < S.round ? "done" : i === S.round ? "now" : ""}"></span>`).join("");
  const turnTxt = turn === "player" ? "내 차례 · 칸이나 건물을 누르세요" : turn === "bot" ? "봇이 고르는 중…" : "일하기 단계 끝";
  const sc = botScore(), lb = S.lastBot;

  app.innerHTML = header(`<button class="m-hide" data-act="undo" ${history.length ? "" : "disabled"}>되돌리기</button><button id="newgame">새 게임</button>`) + `
  <div class="status">
    <span class="round">${S.round}라운드</span><span class="pips" aria-label="8라운드 중 ${S.round}라운드">${pips}</span>
    <span class="workers"><span><span class="dot p"></span>나 ${pLeft}</span><span><span class="dot b"></span>봇 ${bLeft}</span></span>
    <span class="label" style="color:#f4f1dcb0">${MODES[S.settings.mode].nm}</span>
    <span class="turn">${turnTxt}</span>
  </div>
  <div class="play">
    <div>${boardHTML(myTurn)}${tilesHTML(myTurn)}</div>
    <aside class="side">
      ${turn === null ? `<div class="callout endcall"><h3>집에 돌아오기 · 번식</h3>
        <p class="sub" style="margin:0">일꾼 6개를 모두 놓았습니다. 내 농장의 가축을 번식시킨 뒤 라운드를 끝내세요.</p>
        <button class="primary" data-act="endround">${S.round >= 8 ? "게임 종료 · 점수 계산" : `${S.round}라운드 끝내기`}</button></div>` : ""}
      ${lb ? `<div class="callout botmove"><span class="label">봇의 마지막 행동</span>
        <div class="botline">${lb.bk != null ? `<img src="${img(lb.bk)}" alt="" style="width:56px;border-radius:6px">` : `<span class="big">${lb.n}</span>`}
        <div><b>${esc(lastBotName(lb))}</b><div class="sub small" style="margin:0">선택지 ${lb.pool}곳 중 무작위</div></div></div>
        ${lb.cleared ? `<div>공동 창고로 되돌리기: <b>${lb.cleared}</b></div>` : ""}
        ${lb.gain ? `<div>봇이 수집: <b>${esc(lb.gain)}</b></div>` : ""}</div>` : ""}
      <div class="callout"><h3>봇 현황</h3>
        <div class="stats">
          <span>경계선 (시작 9개 포함)</span><span class="v">${S.bot.fences}</span>
          <span>확장판</span><span class="v">${S.bot.ext}</span>
          <span>축사</span><span class="v">${S.bot.stalls}</span>
          <span>특수 건물</span><span class="v">${S.buildings.filter(b => b.owner === "bot").length}</span>
          ${sc ? `<span class="total">현재 봇 점수</span><span class="v total">${sc.total}</span>` : `<span class="total">봇 점수</span><span class="v total">없음</span>`}
        </div>
        <div class="supply"><span>남은 확장판 <b class="num">${S.extLeft}</b></span><span>남은 축사 <b class="num">${S.stallsLeft}</b></span><span>라운드 경계선 <b class="num">${S.roundFences}</b></span></div>
      </div>
      <div class="callout"><h3>기록</h3><div class="log">${S.log.map(l => `<div><span class="num">R${l.r}</span> ${l.t}</div>`).join("")}</div></div>
    </aside>
  </div>` + rulesHTML() + dockHTML(turn, lb) + modalHTML();

  const bindTap = (sel, fn) => app.querySelectorAll(sel).forEach(el => {
    el.onclick = () => fn(el);
    el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(el); } };
  });
  bindTap("[data-sp]", el => { modal = { type: "space", id: +el.dataset.sp }; render(); });
  bindTap("[data-bi]", el => { modal = { type: "space", id: 14, bi: +el.dataset.bi }; render(); });
  app.querySelectorAll('[data-act="undo"]').forEach(b => b.onclick = undo);
  app.querySelectorAll('[data-act="endround"]').forEach(b => b.onclick = endRound);
  document.getElementById("newgame").onclick = () => { modal = { type: "confirmNew" }; render(); };
  bindModal();
}

function dockHTML(turn, lb) {
  const pill = turn === "player" ? `<span class="pill">내 차례</span>` : turn === "bot" ? `<span class="pill bot">봇 차례</span>` : "";
  let msg;
  if (turn === null) msg = `<div class="t"><b>번식 단계</b><div>가축을 번식시킨 뒤 진행</div></div>`;
  else if (turn === "bot") msg = `<span class="big">…</span><div class="t">${pill}<div>봇이 칸을 고르는 중</div></div>`;
  else if (lb) msg = `${lb.bk != null ? `<img src="${img(lb.bk)}" alt="" style="width:44px;border-radius:5px">` : `<span class="big">${lb.n}</span>`}<div class="t">${pill}
      <div><b>봇: ${esc(lastBotName(lb))}</b></div>
      <div>${lb.cleared ? `창고로: ${lb.cleared}` : lb.gain ? `봇 수집: ${esc(lb.gain)}` : `선택지 ${lb.pool}곳 중 무작위`}</div></div>`;
  else msg = `<div class="t">${pill}<div>게임판 칸이나 건물을 누르세요</div></div>`;
  const end = turn === null ? `<button class="primary" data-act="endround">${S.round >= 8 ? "점수 계산" : `${S.round}R 끝내기`}</button>` : "";
  return `<div class="dock"><div class="dock-in"><div class="dock-msg">${msg}</div>
    <div class="dock-btns"><button data-act="undo" ${history.length ? "" : "disabled"}>되돌리기</button>${end}</div></div></div>`;
}

// 칸을 눌렀을 때: 얻을 것을 보여주고 확인받기
function spaceModal(id, bi) {
  const sp = SP[id];
  const g = id === 7 ? sp.fixed : (S.goods[id] || {});
  const items = Object.entries(g).filter(([, n]) => n > 0);
  const gain = items.length ? `<div class="gain">${items.map(([k, n]) => `<span class="g"><span class="tk ${k}">${n}</span>${G[k]} ${n}${["sheep", "pig", "cow", "horse"].includes(k) ? "마리" : "개"}</span>`).join("")}</div>` : "";
  const animalNote = sp.animal ? `<p class="sub small" style="margin:0">농장에 둘 자리가 없는 가축은 공동 창고로 돌려놓습니다.</p>` : "";
  let body = "", btns = "";
  if (id === 14) {
    const avail = S.buildings.map((b, i) => ({ b, i })).filter(x => !x.b.owner);
    if (bi != null) {
      const b = S.buildings[bi];
      body = `<div class="mhead"><img src="${img(b.key)}" alt=""><div><b>${esc(bname(b))}</b><div class="sub small">${vpText(BLD[b.key])}${BLD[b.key].note ? " · " + esc(BLD[b.key].note) : ""}</div></div></div>
        <p class="sub small" style="margin:0">특수 건물 짓기 칸에 일꾼을 놓고 이 건물을 짓습니다. 건설 비용은 타일을 보고 직접 내세요.</p>`;
      btns = `<button class="primary" data-go="bi" data-v="${bi}">건설 확인</button>`;
    } else {
      body = `<p class="sub small" style="margin:0">지을 건물을 고르세요. 건설 비용은 타일을 보고 직접 내세요.</p>`;
      btns = avail.map(({ b, i }) => `<button class="bopt" data-go="bi" data-v="${i}"><img src="${img(b.key)}" alt=""><span><b>${esc(bname(b))}</b><br><span class="sub small">${vpText(BLD[b.key])}</span></span></button>`).join("");
    }
  } else if (id === 8) {
    body = `${gain || `<p style="margin:0">가져올 경계선이 없습니다.</p>`}<p class="sub small" style="margin:0">남은 농장 확장판: ${S.extLeft}개</p>`;
    btns = (S.extLeft > 0 ? `<button class="primary" data-go="ext">가져오고 확장판 1개 연결</button>` : "") + `<button data-go="ok">${S.extLeft > 0 ? "경계선만 가져오기" : "확인"}</button>`;
  } else if (id === 9) {
    body = `<p style="margin:0">돌 3개와 갈대 1개를 내고 축사 1개를 짓습니다.</p><p class="sub small" style="margin:0">남은 축사 타일: ${S.stallsLeft}개</p>`;
    btns = (S.stallsLeft > 0 ? `<button class="primary" data-go="stall">축사 짓기 확인</button>` : "") + `<button data-go="ok">타일 없이 칸만 사용</button>`;
  } else {
    body = gain ? `${gain}${animalNote}` : `<p style="margin:0">가져올 자원은 없습니다.</p>`;
    if (sp.ds) body += `<p class="sub small" style="margin:0">${sp.ds}</p>`;
    btns = `<button class="primary" data-go="ok">${gain ? "가져오기 확인" : "확인"}</button>`;
  }
  return `<span class="label">${gain && id !== 8 ? "획득" : "행동"}</span><h3>${sp.nm}</h3>${body}<div class="choice">${btns}</div>`;
}

function modalHTML() {
  if (S.notice) {
    const n = S.notice;
    const btn = n.next ? (S.round >= 8 ? "확인 · 점수 계산" : `확인 · ${S.round + 1}라운드 시작`) : "확인";
    return `<div class="modal" id="modal"><div class="box notice" role="alertdialog" aria-modal="true" aria-labelledby="ntitle">
      <span class="label" style="color:var(--bot)">봇 알림</span><h3 id="ntitle">${n.title}</h3>
      <p class="sub" style="margin:0">${n.lead}</p><ul class="takes">${n.lines.map(l => `<li>${l}</li>`).join("")}</ul>
      <p style="margin:0">${n.foot}</p>
      <button class="primary" id="nok">${btn}</button><button id="nundo" ${history.length ? "" : "disabled"}>되돌리기</button></div></div>`;
  }
  if (!modal) return "";
  let inner = "";
  if (modal.type === "space") inner = spaceModal(modal.id, modal.bi);
  else if (modal.type === "confirmNew") inner = `<h3>새 게임을 시작할까요?</h3><p class="sub" style="margin:0">진행 중인 게임은 지워집니다.</p>
      <div class="choice"><button class="primary" data-go="new">새 게임 설정으로</button></div>`;
  return `<div class="modal" id="modal"><div class="box" role="dialog" aria-modal="true">${inner}<button id="mclose">취소</button></div></div>`;
}
function bindModal() {
  const m = document.getElementById("modal"); if (!m) return;
  // 창 밖이나 스크롤할 내용이 없는 창 안을 끌어도 뒤 페이지가 움직이지 않게
  const box = m.querySelector(".box");
  m.addEventListener("touchmove", e => { if (!box.contains(e.target) || box.scrollHeight <= box.clientHeight) e.preventDefault(); }, { passive: false });
  const ok = document.getElementById("nok");
  if (ok) { ok.onclick = confirmNotice; document.getElementById("nundo").onclick = undo; ok.focus(); return; }
  document.getElementById("mclose").onclick = () => { modal = null; render(); };
  m.onclick = e => { if (e.target === m) { modal = null; render(); } };
  m.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const go = b.dataset.go;
    if (go === "new") { clearTimeout(botTimer); S = freshSetup(S); history = []; modal = null; save(); render(); return; }
    const id = modal.id;
    if (go === "bi") playerPlace(14, { bi: +b.dataset.v });
    else if (go === "ext") playerPlace(id, { ext: true });
    else if (go === "stall") playerPlace(id, { stall: true });
    else playerPlace(id, {});
  });
  const first = m.querySelector(".choice button"); if (first) first.focus();
}

function scoreRow(id, label, options, cur, pts, hint) {
  return `<label class="srow" for="${id}"><span class="sl">${label}${hint ? `<small>${hint}</small>` : ""}</span>
    <select id="${id}">${options.map(o => Array.isArray(o) ? opt(o[0], cur, o[1]) : opt(o, cur)).join("")}</select>
    <span class="sp num">${fmt(pts)}</span></label>`;
}
function fmt(n) { return (n > 0 ? "+" : "") + (Number.isInteger(n) ? n : n.toFixed(1)); }

function renderEnd(patch) {
  const sc = botScore(), ps = S.ps, r = playerScore();
  const verdict = sc ? (r.total > sc.total ? "승리!" : r.total === sc.total ? "동점" : "봇의 승리") : "";
  let best = null; try { best = +localStorage.getItem(KEY + "-best-" + S.settings.mode) || null; } catch (e) {}
  const notBot = S.buildings.map((b, i) => ({ b, i })).filter(x => x.b.owner !== "bot");

  const html = header(`<button id="undo" ${history.length ? "" : "disabled"}>되돌리기</button><button class="primary" id="newgame">새 게임</button>`) + `
  <div class="endsum">
    <div><span class="label">내 점수</span><div class="n">${fmt(r.total).replace("+", "")}</div></div>
    ${sc ? `<div><span class="label">봇 점수</span><div class="n">${sc.total}</div></div><div class="verdict">${verdict}</div>`
         : `<div><span class="label">이 난이도 최고 점수</span><div class="n">${best ?? "-"}</div></div>`}
  </div>
  <div class="endgrid">
    <section class="panel"><h2>내 점수 계산</h2>
      <p class="sub small" style="margin:0">농장을 보고 고르면 점수가 바로 계산됩니다.</p>
      <h3>가축</h3>
      ${ANIMALS.map(([k, nm]) => scoreRow("ps-" + k, nm, range(0, 40), ps[k], +ps[k] + r.rows[k], `기본 ${ps[k]} · 추가 ${fmt(r.rows[k])}`)).join("")}
      <h3>농장 확장</h3>
      ${scoreRow("ps-extFull", "농장 칸 3칸을 모두 쓴 확장판", range(0, 6), ps.extFull, r.ext, `가져온 확장판 ${S.me.ext}개 · 1개당 4점`)}
      <h3>건물</h3>
      ${scoreRow("ps-stalls", "축사", range(0, 6), ps.stalls, ps.stalls * STALL_VP, "1개당 1점")}
      ${scoreRow("ps-stables", "외양간", range(0, 6), ps.stables, ps.stables * STABLE_VP, "1개당 4점")}
      ${notBot.map(({ b, i }) => {
        const d = BLD[b.key], cur = ps.bv[i] == null ? "" : ps.bv[i];
        const opts = [["", "없음"]].concat(d.opts ? d.opts.map(v => [v, `${v}점`]) : [[d.vp, "지음"]]);
        const pts = ps.bv[i] == null ? 0 : b.key === STORE_KEY ? ps.res * 0.5 : +ps.bv[i];
        return scoreRow("ps-bv-" + i, esc(d.name), opts, cur, pts, d.note || `${d.vp}점`);
      }).join("")}
      ${ps.bv[S.buildings.findIndex(b => b.key === STORE_KEY)] != null ? scoreRow("ps-res", "저장고 · 남은 건축 자원", range(0, 60), ps.res, ps.res * 0.5, "나무+돌+갈대 합계") : ""}
      ${scoreRow("ps-extra", "기타 조정", range(-10, 20), ps.extra, r.extra, "위에서 다루지 않은 점수")}
      <div class="srow total"><span class="sl">합계</span><span></span><span class="sp num">${fmt(r.total).replace("+", "")}</span></div>
    </section>
    <div class="side">
      <section class="panel"><h2>봇 최종 점수 · ${MODES[S.settings.mode].nm}</h2>
        ${sc ? `<div class="stats">
          <span>특수 건물 (${sc.names.map(esc).join(", ") || "없음"})</span><span class="v">${sc.bld}</span>
          <span>축사 ${S.bot.stalls}개 × ${sc.stallEach}</span><span class="v">${sc.stalls}</span>
          <span>경계선 ${S.bot.fences}개 × ${sc.per}</span><span class="v">${sc.fences}</span>
          <span>확장판 ${S.bot.ext}개 × ${sc.per}</span><span class="v">${sc.ext}</span>
          <span class="total">합계</span><span class="v total">${sc.total}</span></div>`
        : `<p class="sub">이 난이도에서 봇은 점수를 얻지 않습니다. 내 최고 점수를 넘어 보세요.</p>
           <div class="stats"><span>봇이 가져간 경계선</span><span class="v">${S.bot.fences}</span><span>봇이 가져간 확장판</span><span class="v">${S.bot.ext}</span></div>`}
      </section>
      <section class="panel"><h3>게임 기록</h3><div class="log">${S.log.map(l => `<div><span class="num">R${l.r}</span> ${l.t}</div>`).join("")}</div></section>
    </div>
  </div>` + modalHTML();

  if (patch) {
    const tmp = document.createElement("div"); tmp.innerHTML = html;
    if (tmp.querySelectorAll("select").length === app.querySelectorAll("select").length) {
      for (const sel of [".endsum", ".srow .sl small", ".srow .sp"]) {
        const a = app.querySelectorAll(sel), b = tmp.querySelectorAll(sel);
        a.forEach((el, i) => { if (b[i] && el.innerHTML !== b[i].innerHTML) el.innerHTML = b[i].innerHTML; });
      }
      return;
    }
  }
  app.innerHTML = html;

  app.querySelectorAll("select[id^=ps-]").forEach(el => el.onchange = () => {
    const k = el.id.slice(3);
    if (k.startsWith("bv-")) ps.bv[+k.slice(3)] = el.value === "" ? null : +el.value; else ps[k] = +el.value;
    const t = playerScore().total;
    try { const kk = KEY + "-best-" + S.settings.mode; if (t > (+localStorage.getItem(kk) || -99)) localStorage.setItem(kk, t); } catch (e) {}
    save(); renderEnd(true);
  });
  document.getElementById("undo").onclick = undo;
  document.getElementById("newgame").onclick = () => { S = freshSetup(S); history = []; save(); render(); };
  bindModal();
}

function rulesHTML() {
  return `<section class="rules"><details><summary>솔로 변형 규칙 요약</summary><div class="cols">
    <div><h3>봇 규칙</h3><ul>
      <li>봇은 농장판이 없고 건물·울타리를 짓지 않습니다. 칸을 막고, 그 칸에 쌓인 자원·가축을 공동 창고로 돌려놓습니다.</li>
      <li>봇은 지금 고를 수 있는 선택지 중 하나를 무작위로 고릅니다. 빈 행동 칸 하나하나, 그리고 특수 건물 짓기 자리가 비어 있으면 남은 건물 하나하나가 선택지입니다.</li>
      <li>봇이 건물을 고르면 특수 건물 짓기 칸에 일꾼을 놓고 그 건물을 수집합니다 (게임에서 제거).</li>
      <li>농장 확장 칸에서는 경계선과 확장판 1개를, 축사 짓기 칸에서는 축사 타일 1개를 수집합니다.</li>
      <li>각자 일꾼 3개, 차례를 번갈아 놓고 8라운드를 진행합니다.</li></ul></div>
    <div><h3>건물과 점수</h3><ul>
      <li>기본 특수 건물 4개(나무골조 집, 저장고, 가축 보호소, 개방형 외양간)는 항상 포함되고, 추가 특수 건물을 0–8개 더 고릅니다.</li>
      <li>봇 점수에서 변동 점수 건물은 봇에게 농장이 없다고 보고 계산합니다 (저택 7점, 사무실 6점, 조건부 건물과 저장고 0점).</li>
      <li>축사 1점, 외양간 4점 (룰북 4쪽).</li></ul>
      <p class="sub small">게임판과 건물 이미지는 한국어판 룰북에서 가져왔습니다.</p></div>
  </div></details></section>`;

function render() { if (S.phase === "setup") renderSetup(); else if (S.phase === "play") renderPlay(); else renderEnd(); }

function start(hot) {

  else if (load()) { if (S.phase !== "setup") { load0 = { S, history }; S = freshSetup(S); history = []; } }
  else S = freshSetup(null);
  render(); scheduleBot();
}
window.claude?.hot?.snapshot?.(() => ({ S, history }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
